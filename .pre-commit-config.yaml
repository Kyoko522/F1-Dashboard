# Pre-commit hooks — run locally before each commit to catch issues
# CI would catch anyway. Install once with: pip install pre-commit && pre-commit install
#
# Skip a single commit with: git commit --no-verify
# Run against all files manually: pre-commit run --all-files

repos:
  # Universal hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(package-lock\.json|tsconfig.*\.json)$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  # Backend — Python lint + format via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend — Prettier + ESLint
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(js|jsx|css|json)$

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint'
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false
