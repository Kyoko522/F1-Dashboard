# Continuous Integration — runs on every push and pull request to main.
# Pipeline:
#   1. backend  → ruff lint + ruff format check + pytest
#   2. frontend → eslint + prettier check + vite build
#   3. docker   → verify the production image builds
#
# Deployment is handled outside CI: Railway auto-deploys the backend on push to main,
# Vercel auto-deploys the frontend on push to main. CI must pass before either runs.

name: F1 Dashboard CI

on:
  pull_request: 
    branched: 
    - main
  
jobs: 
  test: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -m "not integration"